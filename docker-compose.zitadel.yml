# Local/self-hosted Zitadel for development (see SETUP-ZITADEL.md).
# Console: http://localhost:8080/ui/console  (initial admin: zitadel-admin@zitadel.localhost / Password1!)
services:
  zitadel:
    image: ghcr.io/zitadel/zitadel:v2.65.1
    command: 'start-dev --masterkeyFromEnv --tlsMode disabled'
    environment:
      ZITADEL_MASTERKEY: 'MasterkeyNeedsToHave32Characters!'
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: 'false'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - zitadel-db:/var/lib/postgresql/data

volumes:
  zitadel-db:
